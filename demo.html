<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saktum demo: choose who you are</title>
<style>
:root{--bg:#f7f7fb;--card:#fff;--ink:#16161d;--ink-2:#55556a;--line:#e3e2ec;--accent:#5a3fc0;--accent-2:#ece8fb;--ok:#2e7d32;--ok-bg:#e7f4e8;--bad:#c62828;--bad-bg:#fdecec;--warn:#b7791f;--warn-bg:#fff6e0;--soft:#f1f0f7;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0f15;--card:#18181f;--ink:#ededf5;--ink-2:#a6a6ba;--line:#2b2b38;--accent:#9a86ef;--accent-2:#252038;--ok:#7fd287;--ok-bg:#16301a;--bad:#ef8a8a;--bad-bg:#3a1717;--warn:#f0c060;--warn-bg:#382c12;--soft:#1e1e28;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f0f15;--card:#18181f;--ink:#ededf5;--ink-2:#a6a6ba;--line:#2b2b38;--accent:#9a86ef;--accent-2:#252038;--ok:#7fd287;--ok-bg:#16301a;--bad:#ef8a8a;--bad-bg:#3a1717;--warn:#f0c060;--warn-bg:#382c12;--soft:#1e1e28;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent)}button{font:inherit;cursor:pointer}
.top{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
.top b a{color:var(--ink);text-decoration:none}.top .sp{flex:1}.muted{color:var(--ink-2)}
main{max-width:1240px;margin:0 auto;padding:22px 16px 60px}
h1{font-size:clamp(26px,4vw,38px);margin:4px 0 6px}h2{font-size:20px;margin:0 0 10px}
.personas{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;text-align:left;color:var(--ink)}
.pcard:hover{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-2)}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
.pcard .role{font:600 12px var(--mono);letter-spacing:.06em;color:var(--accent);text-transform:uppercase}
.pcard .go{margin-top:auto;font-weight:600;color:var(--accent)}
.admin{border-style:dashed}
.dash{display:grid;grid-template-columns:260px 1fr 330px;gap:14px;margin-top:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.who{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;flex-wrap:wrap}
.who .meta{flex:1;min-width:200px}.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;background:var(--soft)}
.wallet{font:700 16px var(--mono)}.wallet.flash{animation:fl .8s}@keyframes fl{from{background:var(--accent-2)}to{background:var(--soft)}}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.steps li{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px;color:var(--ink-2)}
.steps li.done{color:var(--ink)}.steps li.done::before{content:"\2713  ";color:var(--ok);font-weight:700}
.steps li.cur{border-color:var(--accent);background:var(--accent-2);color:var(--ink);font-weight:600}
.ws{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;align-content:start;min-height:320px}
.cx{border:1px solid var(--line);border-left:5px solid var(--c,#888);border-radius:12px;padding:10px;background:var(--card);animation:pop .45s ease both}
.cx.new{box-shadow:0 0 0 3px var(--accent-2)}@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
.cx .k{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}.cx b{display:block;margin:2px 0 4px}.cx div{font-size:13px}
.ok{color:var(--ok)}.no{color:var(--bad)}.wn{color:var(--warn)}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:4px}.chain span{border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:12.5px;background:var(--soft)}.chain .ar{border:0;background:none;padding:0;color:var(--ink-2)}
.votes{display:flex;gap:6px;margin-top:6px}.votes span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff}
.say{font-size:15px}.cmd{font:12.5px var(--mono);background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:8px 10px;white-space:pre-wrap;word-break:break-word;margin-top:4px}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:10px;padding:8px 14px;font-weight:600;text-align:left}.btn.ghost{background:transparent;color:var(--accent)}
.ledger{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.blocks{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;align-items:center}
.blk{flex:none;min-width:150px;max-width:220px;border:1px solid var(--line);border-radius:10px;padding:8px;font-size:12px;background:var(--soft);animation:pop .4s both}
.blk .h{font:11px var(--mono);color:var(--ink-2)}.arrow{flex:none;color:var(--ink-2)}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.legend span{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:3px 9px;opacity:.45}.legend span.on{opacity:1;border-color:var(--accent)}
.note{font-size:13px;border-left:3px solid var(--warn);padding:6px 10px;background:var(--warn-bg);border-radius:8px;margin-top:10px}
@media (max-width:1050px){.dash{grid-template-columns:1fr}.personas{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.personas{grid-template-columns:1fr}}
</style></head><body>
<header class="top"><b><a href="/">Saktum</a></b><span class="muted">Interactive demo</span><span class="sp"></span><a href="#" id="switch" hidden>Switch persona</a></header>
<main id="app"></main>
<script>
"use strict";
var C={org:["\u{1F3E2}","Organisation","#5a3fc0"],id:["\u{1FAAA}","Identity","#2563eb"],chain:["\u{1F517}","Accountability chain","#2563eb"],server:["\u{1F5A5}\uFE0F","MCP server","#0f766e"],passport:["\u{1F6C2}","Passport","#2e7d32"],catalog:["\u{1F4D2}","Catalogue","#0f766e"],agreement:["\u{1F4DC}","Agreement","#7c3aed"],wallet:["\u{1F45B}","Wallet and tokens","#b7791f"],receipts:["\u{1F9FE}","Receipts","#64748b"],mandate:["\u{1F4CB}","Mandate","#7c3aed"],approval:["\u270D\uFE0F","Signed approval","#b7791f"],policy:["\u{1F6E1}\uFE0F","Policy","#c62828"],alert:["\u{1F514}","Alert","#c62828"],bounty:["\u{1F3AF}","Bounty","#be185d"],consensus:["\u{1F5F3}\uFE0F","Consensus","#be185d"],evidence:["\u{1F4CE}","Evidence","#64748b"],inventory:["\u{1F5C2}\uFE0F","Inventory","#0f766e"]};
function cx(k,t,lines,extra){return {k:k,t:t,lines:lines||[],x:extra||null};}
var P=[
 {id:"pilot",name:"Your pilot",role:"Enterprise pilot (4 weeks)",org:"Your company",col:"#16161d",goal:"What a four-week MCP Trust Assessment delivers, step by step. Everything here works today.",
  steps:[
  {t:"Week 1: see every MCP server in use",say:"Your device-management tool runs one command on the pilot machines. Saktum merges the results into one inventory: who uses which servers, with which risks and costs. Nothing leaves your environment.",cmd:"scripts/pilot/scan-config-windows.ps1  (or scan-config-macos.sh)\nnpx saktum fleet setups/*.json --html inventory.html",add:[cx("inventory","Your inventory",["40 machines \u00b7 23 servers","<span class=wn>3 unvetted \u00b7 2 duplicates</span>"])]},
  {t:"Week 2: your policy, enforced",say:"Together we turn your rules into policy as code, build an allowlist for your MCP firewall, and turn on daily monitoring for silent changes.",cmd:"npx saktum fleet setups/*.json --policy saktum-policy.yaml\nnpx saktum allowlist reports/*.json",add:[cx("policy","Your policy",["R4 servers must be L5","<span class=no>2 violations</span> \u00b7 1 exception with an expiry"]),cx("alert","Monitoring",["Alert if any approved server's tools change"])],led:["Allowlist published (digest)"]},
  {t:"Week 3: one agent workflow governed",say:"Your coding agents (or another workflow) run behind Saktum: their own repository only, production releases after a signed approval sent to Slack or Teams, a receipt for every action. Remote MCP tools work through the bridge.",cmd:"npx saktum proxy --mandate agent-mandate.json --approval-webhook https://\u2026 --enforce -- npx saktum bridge https://\u2026/mcp",add:[cx("mandate","Coding agent instructions",["Its own repository only","Production only with approval"]),cx("approval","Approved from Slack",["build-2291 to production, once"]),cx("receipts","Receipts",["<span class=ok>\u2713</span> 5 actions \u00b7 <span class=no>\u26D4</span> 2 stopped"])],led:["Receipt digests: 7 calls"]},
  {t:"Week 4: the board report",say:"The executive assessment: inventory, risks, agents and their accountability, a business case, and evidence mapped to the EU AI Act, NIST AI RMF and ISO 42001. It supports evidence; it never claims compliance.",cmd:"npx saktum agents scan --out agents.json\nnpx saktum assess --fleet inventory.json --agents-inventory agents.json",add:[cx("evidence","Executive assessment",["Business case and recommendations","EU AI Act \u00b7 NIST AI RMF \u00b7 ISO/IEC 42001"])]}]},
 {id:"maya",name:"Maya",role:"MCP server provider",org:"Demo Grocer",col:"#0f766e",goal:"Publish a trusted server, agree terms, get paid per call.",
  steps:[
  {t:"Register the organisation",say:"Maya registers Demo Grocer. The organisation gets its own identity, bound to its domain. Everything it publishes later is pinned to it.",cmd:"npx saktum org init --name \"Demo Grocer\" --domain grocer.example",add:[cx("org","Demo Grocer",["grocer.example \u2713 domain","did:key:z6Mk\u2026Grc"]),cx("wallet","Demo Grocer wallet",["0 tokens"])],led:["Organisation registered: Demo Grocer"]},
  {t:"Issue identities to the team",say:"The organisation credentials Maya, and Maya credentials the key that will sign their server's results. Anyone can walk this chain back to the organisation.",cmd:"npx saktum identity issue --from org-credential.json --type member --name Maya --role \"provider admin\"",add:[cx("chain","Who is accountable",[],{chain:["Demo Grocer","Maya (provider admin)","server key"]})],led:["Credentials issued (digests only)"]},
  {t:"Pin the MCP server to the organisation",say:"The grocery MCP server is registered under Demo Grocer, with a fingerprint of its exact tools. Any change to the tools changes the fingerprint.",cmd:"npx saktum check -- npx -y demo-grocer-mcp",add:[cx("server","demo-grocer 1.0.0",["Pinned to Demo Grocer","3 tools \u00b7 fingerprint 9f\u20264c"])]},
  {t:"Earn the passport",say:"Saktum Check tests conformance, security and agent readiness, and works out how much care the server needs. The signed result becomes its passport.",cmd:"npx saktum passport -- npx -y demo-grocer-mcp",add:[cx("passport","Server passport",["<span class=ok>Trust A \u00b7 Readiness A</span>","Risk R4: moves money","Maturity L5 \u00b7 self-tested"])],led:["Attestation: demo-grocer 1.0.0"]},
  {b:"local",t:"Publish to the catalogue",say:"A signed manifest lists what the server offers, what each tool means (its intents) and its rates in prepaid tokens. Agents can now find it by what they need.",cmd:"npx saktum manifest create --publisher \"Demo Grocer\" --rate pay_for_order=5 -- \u2026\nnpx saktum catalog add saktum-manifest.json",add:[cx("catalog","Demo Grocer listing",["Intents: search, cart, pay (commerce)","Rates: 1 \u00b7 2 \u00b7 5 tokens per call"])],led:["Manifest published"]},
  {b:"local",t:"Offer an agreement",say:"Maya offers Acme Corp an agreement: six default terms plus two specific ones. She signs; Acme countersigns. Any change breaks both signatures.",cmd:"npx saktum agreement draft --manifest saktum-manifest.json --invoker <acme> --purpose \"Weekly office groceries\"",add:[cx("agreement","Demo Grocer \u21C4 Acme Corp",["6 default + 2 specific terms","<span class=ok>Signed by both</span>"])],led:["Agreement recorded"]},
  {b:"local",t:"Get paid per call",say:"Acme's agent calls the server. Each allowed call is metered: Acme's prepaid tokens move to Demo Grocer, double-entry. Blocked calls never reach the server and cost nothing.",cmd:"npx saktum usage --agreement saktum-agreement.json --key grocer-key.json",add:[cx("receipts","Calls from Acme's agent",["<span class=ok>\u2713</span> search \u00b7 add \u00b7 add \u00b7 pay \u00b7 add","<span class=no>\u26D4</span> insufficient credit (no charge)"]),cx("wallet","Usage statement",["12 tokens, signed by Demo Grocer","matches Acme's receipts"])],wal:12,led:["Usage statement: 12 tokens"]},
  {t:"Stay in good standing",say:"Monitoring re-checks the server daily. A researcher's finding, confirmed by consensus, was fixed; the passport is renewed as independently checked.",cmd:"npx saktum watch saktum-allowlist.json",add:[cx("alert","Watch",["Tools changed in 1.0.1 \u2192 re-checked","<span class=ok>Passport renewed</span>"]),cx("passport","Passport 1.0.1",["Trust A \u00b7 Readiness A","Independently checked"])],led:["Attestation: demo-grocer 1.0.1"]}]},
 {id:"arjun",name:"Arjun",role:"Agent builder",org:"Acme Corp",col:"#2563eb",goal:"Give an agent clear instructions, find tools, and pay only for what it does.",
  steps:[
  {t:"Register the organisation",say:"Acme Corp registers, bound to its domain, and gets a wallet for prepaid tokens.",cmd:"npx saktum org init --name \"Acme Corp\" --domain acme.example",add:[cx("org","Acme Corp",["acme.example \u2713 domain"]),cx("wallet","Acme wallet",["0 tokens"])],led:["Organisation registered: Acme Corp"]},
  {t:"Give the agent an accountable identity",say:"Acme credentials Priya (procurement lead), and Priya credentials the shopping agent. Every call the agent makes can be traced to a person and the organisation.",cmd:"npx saktum identity issue --from priya.json --type agent --name \"Acme shopping agent\"",add:[cx("chain","Who is accountable",[],{chain:["Acme Corp","Priya (procurement lead)","shopping agent"]}),cx("id","Agent passport",["Maturity A2 Accountable"])],led:["Credentials issued (digests only)"]},
  {t:"Write its instructions",say:"The mandate is the agent's instructions, not just limits: what it may do on its own, what it must ask about, and its preferences. Acme IT countersigns it as the operator.",cmd:"npx saktum agent create --name \"Shopper\" --intent examples/mandate-grocery.json\nnpx saktum agent cosign agent-mandate.json --name \"Acme IT\"",add:[cx("mandate","Instructions, in plain words",["Weekly office groceries","At most 2 of each item; never alcohol","Substitutes within 10%, never baby food","Asks before upgrades; approval above $50"]),cx("id","Agent passport",["Maturity A3 Bounded"])]},
  {b:"local",t:"Find a tool by intent",say:"The agent searches for what it needs, not for a product name. Only signed manifests are returned, each with its server's passport.",cmd:"npx saktum catalog search \"buy weekly groceries for the office\"",add:[cx("catalog","Search results",["1. Demo Grocer: trust A, risk R4, L5","matched: search, cart, pay (commerce)"])]},
  {b:"local",t:"Agree and fund",say:"Acme accepts Demo Grocer's agreement (both signatures) and tops up 12 prepaid tokens, bought outside Saktum. No money is handled in the product.",cmd:"npx saktum agreement accept saktum-agreement.json --key org-key.json\nnpx saktum wallet topup --account <acme> --tokens 12",add:[cx("agreement","Acme Corp \u21C4 Demo Grocer",["<span class=ok>Signed by both</span>"])],wal:12,led:["Agreement recorded","Wallet top-up: 12 tokens"]},
  {t:"The agent goes shopping",say:"Every call is checked against the mandate and the agreement before it reaches the store. Allowed calls are metered; blocked calls cost nothing. A hidden instruction in a listing tries to make it buy gift cards: the mandate holds.",cmd:"npx saktum proxy --mandate agent-mandate.json --credential agent.json --agreement saktum-agreement.json --wallet saktum-wallet.json --enforce -- \u2026",add:[cx("receipts","Receipts, each with its reason",["<span class=ok>\u2713</span> searches (1 token)","<span class=ok>\u2713</span> oat milk, usual brand (2)","<span class=no>\u26D4</span> 5 bags of apples: at most 2","<span class=no>\u26D4</span> 10 gift cards (hidden instruction)","<span class=ok>\u2713</span> coffee beans (2)"])],wal:-5,led:["Receipt digests: 5 calls"]},
  {t:"Approve exactly one action",say:"Paying for a $60 order is above the approval threshold, so it is held. Priya signs approval of exactly that order, once. The retry goes through; a different amount would need a new approval.",cmd:"npx saktum agent approve apr_81815f\u2026 --mandate agent-mandate.json",add:[cx("approval","Priya approved apr_81815f",["$60.00 order, once, within 60 minutes","<span class=ok>\u2713</span> retried and paid (5 tokens)"])],wal:-5,led:["Approval used: apr_81815f"]},
  {b:"local",t:"Credit runs out; the record stays",say:"With too little credit left, the next call is refused. The agent's passport shows its instructions, its track record and its maturity.",cmd:"npx saktum passport --agent agent-mandate.json --receipts receipts.jsonl",add:[cx("receipts","Last calls",["<span class=ok>\u2713</span> adds bread (2): balance 0","<span class=no>\u26D4</span> next search: insufficient credit"]),cx("id","Agent passport",["Maturity A4 Explained","5 actions within its instructions (1 after approval)","4 attempts stopped before the store"])],wal:-2}]},
 {id:"kai",name:"Kai",role:"Platform engineer (coding agents)",org:"Acme Corp",col:"#ea580c",goal:"Let a coding agent work overnight, safely, and approve what reaches production.",
  steps:[
  {t:"Give the coding agent an identity",say:"The platform team credentials the coding agent, so every action it takes overnight is traceable to Kai and Acme.",cmd:"npx saktum identity issue --from kai.json --type agent --name \"payments coding agent\"",add:[cx("chain","Who is accountable",[],{chain:["Acme Corp","Kai (platform engineer)","coding agent"]})],led:["Credentials issued (digests only)"]},
  {t:"Write its instructions",say:"Fix the failing tests in its own repository; open pull requests on its own; production releases only with Kai's approval. The platform team countersigns.",cmd:"npx saktum agent create --name \"coder\" --intent coding.json --allow-destructive",add:[cx("mandate","Instructions, in plain words",["Fix the failing tests in payments-service","Only the payments-service repository","Asks before any production release"]),cx("id","Agent passport",["Maturity A3 Bounded"])]},
  {t:"Work overnight",say:"Tests, a pull request, its own staging secret, a staging deploy: all allowed. An attempt to read another repository's production key is stopped before it reaches the secrets store.",cmd:"npx saktum proxy --mandate agent-mandate.json --enforce -- \u2026",add:[cx("receipts","Overnight receipts",["<span class=ok>\u2713</span> runs 412 tests \u00b7 opens PR #318","<span class=ok>\u2713</span> reads its own staging secret","<span class=no>\u26D4</span> another repository's production key","<span class=ok>\u2713</span> deploys build-2291 to staging"])],led:["Receipt digests: 5 calls"]},
  {t:"Approve exactly one release",say:"The production release waited overnight. In the morning Kai approves exactly build-2291, once; the agent's retry releases it, and the receipt records who approved.",cmd:"npx saktum agent approve apr_6ac56a\u2026 --mandate agent-mandate.json",add:[cx("approval","Kai approved build-2291",["Production release, once","<span class=ok>\u2713</span> released"])],led:["Approval used: build-2291"]},
  {t:"Review the night",say:"The agent's passport: what it did, what was stopped, who approved what, and its maturity. Saktum governs its tool calls; the sandbox contains its machine.",cmd:"npx saktum passport --agent agent-mandate.json --receipts receipts.jsonl",add:[cx("id","Agent passport",["Maturity A4 Explained","5 actions (1 after approval) \u00b7 2 stopped"])]}]},
 {id:"priya",name:"Priya",role:"Procurement and vendor risk",org:"Acme Corp",col:"#7c3aed",goal:"Approve AI vendors in a day with evidence, not a two-week questionnaire.",
  steps:[
  {t:"Receive the vendor's passport",say:"Instead of sending Demo Grocer a security questionnaire, Priya asks for its passport: signed evidence of how its server behaves, its risk and its maturity.",cmd:"npx saktum passport -- npx -y demo-grocer-mcp",add:[cx("passport","Demo Grocer passport",["<span class=ok>Trust A \u00b7 Readiness A</span>","Risk R4: moves money \u00b7 Maturity L5","Independently checked"])]},
  {t:"Verify it, without trusting anyone",say:"The signature is valid, the passport is recorded in the public ledger, and its tool fingerprint matches the server Acme will actually use.",cmd:"npx saktum verify saktum-report.json\nnpx saktum ledger find demo-grocer",add:[cx("evidence","Verification",["<span class=ok>\u2713</span> signature \u00b7 <span class=ok>\u2713</span> ledger entry","<span class=ok>\u2713</span> tools match the live server"])]},
  {t:"Check it against company policy",say:"Acme's policy says servers that move money must reach L5 and have provenance. Demo Grocer meets every rule, so no exception is needed.",cmd:"npx saktum check --policy saktum-policy.yaml -- npx -y demo-grocer-mcp",add:[cx("policy","Acme policy",["R4 requires L5: <span class=ok>met</span>","Provenance: <span class=ok>met</span> \u00b7 data terms: <span class=ok>met</span>"])]},
  {t:"Approve and set the budget",say:"Priya countersigns the agreement, sets a monthly budget of 500 tokens, and turns on monitoring: if the vendor's tools change, Acme is told before its agents keep using them.",cmd:"npx saktum agreement accept saktum-agreement.json --key org-key.json\nnpx saktum watch saktum-allowlist.json",add:[cx("agreement","Acme Corp \u21C4 Demo Grocer",["<span class=ok>Signed by both</span> \u00b7 500 tokens a month","Approved in a day, with evidence"]),cx("alert","Monitoring on",["Alert if the vendor's tools change"])],led:["Agreement recorded"]}]},
 {id:"dana",name:"Dana",role:"Security lead (CISO office)",org:"Acme Corp",col:"#c62828",goal:"Know every agent tool in use, enforce policy, and stop anything at once.",
  steps:[
  {t:"See everything in use",say:"One command on each laptop, merged into an organisation-wide inventory of MCP servers: who uses what, at what cost, with which risks.",cmd:"npx saktum scan-config --yes --out setup.json\nnpx saktum fleet setups/*.json --html inventory.html",add:[cx("inventory","Acme inventory",["40 machines \u00b7 23 servers","<span class=wn>3 unvetted \u00b7 2 duplicates</span>","Agents and their mandates: next release"])]},
  {t:"Apply company policy",say:"Rules as code: risk-tier ceilings, minimum grades, forbidden capabilities. Exceptions need a reason, an approver and an expiry.",cmd:"npx saktum fleet setups/*.json --policy saktum-policy.yaml",add:[cx("policy","Acme policy",["R4 servers must be L5","No unvetted servers on finance laptops","<span class=no>2 violations</span> \u00b7 1 exception (expires 31 Jan)"])]},
  {t:"Pin the allowlist",say:"Approved servers go to the MCP firewall or gateway, pinned to their exact tools. A silent change to a server's tools takes it off the list.",cmd:"npx saktum allowlist reports/*.json",add:[cx("policy","Allowlist",["20 servers, pinned to tool fingerprints"])],led:["Allowlist published (digest)"]},
  {t:"Get alerted to silent changes",say:"Daily monitoring re-checks every approved server. Overnight, one server's tools changed: it is flagged for re-review before agents keep using it.",cmd:"npx saktum watch saktum-allowlist.json --webhook https://\u2026",add:[cx("alert","Watch alert",["crm-tools: tools changed since approval","<span class=no>Blocked pending re-review</span>"])]},

 {id:"sam",name:"Sam",role:"Security researcher",org:"Independent",col:"#be185d",goal:"Find real weaknesses, prove them, and get rewarded fairly.",preview:"Concept preview: the bounty contract exists today; running bounties waits for legal review (researcher terms, safe harbour, disclosure, payouts).",

var app=document.getElementById("app"),sw=document.getElementById("switch"),st=null;
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return ("00000000"+(h>>>0).toString(16)).slice(-8);}
function home(){st=null;sw.hidden=true;if(location.hash)history.replaceState(null,"",location.pathname);
 var cards=P.map(function(p){return '<button class="pcard" data-p="'+p.id+'"><div style="display:flex;gap:10px;align-items:center"><span class="av" style="background:'+p.col+'">'+p.name[0]+'</span><div><b>'+esc(p.name)+'</b><div class="muted">'+esc(p.org)+'</div></div></div><span class="role">'+esc(p.role)+'</span><span>'+esc(p.goal)+'</span><span class="go">Sign in as '+esc(p.name)+' \u2192</span></button>';}).join("");
 cards+='<a class="pcard admin" href="/demo-platform" style="text-decoration:none"><div style="display:flex;gap:10px;align-items:center"><span class="av" style="background:#16161d">\u2699</span><div><b>Platform admin</b><div class="muted">Saktum</div></div></div><span class="role">The whole platform, end to end</span><span>Every party in one story: identities and wallets, Check, the gateway listing, intent search, agreements, Guard, settlement, bounties and consensus, disputes and audit.</span><span class="go">Open the full view \u2192</span></a>';
 app.innerHTML='<h1>Choose who you are</h1><p class="muted">Each journey shows one person\u2019s work with Saktum. The building blocks (organisations, identities, passports, agreements, wallets, receipts and the ledger) appear as they are created. Nothing to install: a guided illustration of what <code>npx saktum demo</code> runs for real. Each step is marked <b>Live</b>, <b>Local today</b> (hosted later, with the gateway) or <b>Concept preview</b>.</p><div class="personas">'+cards+'</div>';
 app.querySelectorAll("[data-p]").forEach(function(b){b.onclick=function(){location.hash=b.getAttribute("data-p");};});}
function start(id){var p=P.filter(function(x){return x.id===id;})[0];if(!p)return home();
 st={p:p,i:-1,items:[],led:[{n:0,t:"Ledger opened",h:hash("genesis"+p.id)}],wal:0};sw.hidden=false;next();}
function next(){var s=st.p.steps[st.i+1];if(!s)return;st.i++;
 st.items.forEach(function(x){x.fresh=false;});
 s.add.forEach(function(a){var o=JSON.parse(JSON.stringify(a));o.fresh=true;st.items.push(o);});
 (s.led||[]).forEach(function(t){var prev=st.led[st.led.length-1];st.led.push({n:st.led.length,t:t,h:hash(prev.h+t)});});
 if(s.wal){st.wal+=s.wal;st.flash=true;}render();}
function badge(b){var m={local:["Local today \u00b7 hosted with the gateway","#7c3aed"],concept:["Concept preview","#be185d"]}[b]||["Live","#2e7d32"];return '<span style="display:inline-block;font:600 12px var(--mono);border:1px solid '+m[1]+';color:'+m[1]+';border-radius:999px;padding:2px 9px;margin:-4px 0 8px">'+m[0]+'</span>';}
function card(o){var m=C[o.k];var body=o.lines.map(function(l){return "<div>"+l+"</div>";}).join("");
 if(o.x&&o.x.chain)body+='<div class="chain">'+o.x.chain.map(function(c,i){return (i?'<span class="ar">\u2192</span>':'')+'<span>'+esc(c)+'</span>';}).join("")+'</div>';
 if(o.x&&o.x.votes)body+='<div class="votes">'+o.x.votes.map(function(v){return '<span style="background:'+(v?"#2e7d32":"#c62828")+'">'+(v?"\u2713":"\u2717")+'</span>';}).join("")+'</div>';
 return '<div class="cx'+(o.fresh?" new":"")+'" style="--c:'+m[2]+'"><span class="k">'+m[0]+" "+m[1]+'</span>'+(o.t?'<b>'+esc(o.t)+'</b>':'')+body+'</div>';}
function render(){var p=st.p,s=p.steps[st.i],last=st.i===p.steps.length-1;
 var kinds={};st.items.forEach(function(o){kinds[o.k]=1;});
 app.innerHTML='<div class="who"><span class="av" style="background:'+p.col+'">'+p.name[0]+'</span><div class="meta"><b>'+esc(p.name)+'</b> \u00b7 '+esc(p.role)+'<div class="muted">'+esc(p.org)+' \u00b7 signed in (demo)</div></div>'+
  '<span class="chip">\u{1FAAA} did:key:z6Mk\u2026'+hash(p.id).slice(0,4)+'</span><span class="chip wallet'+(st.flash?" flash":"")+'">\u{1F45B} '+st.wal+' tokens</span></div>'+
  (p.preview?'<div class="note">'+esc(p.preview)+'</div>':'')+
  '<div class="dash"><div class="panel"><h2>Journey</h2><ol class="steps">'+p.steps.map(function(x,i){return '<li class="'+(i<st.i?"done":i===st.i?"cur":"")+'">'+(i+1)+". "+esc(x.t)+(x.b?' <span class="muted" style="font-size:11px">('+(x.b==="local"?"local today":"concept")+')</span>':'')+'</li>';}).join("")+'</ol></div>'+
  '<div class="panel"><h2>Workspace</h2><div class="ws">'+st.items.map(card).join("")+'</div><div class="legend">'+Object.keys(C).filter(function(k){return kinds[k];}).map(function(k){return '<span class="on">'+C[k][0]+" "+C[k][1]+'</span>';}).join("")+'</div></div>'+
  '<div class="panel"><h2>Step '+(st.i+1)+' of '+p.steps.length+': '+esc(s.t)+'</h2>'+badge(s.b)+'<p class="say">'+esc(s.say)+'</p>'+(s.cmd?'<div class="muted" style="font-size:13px">The real command:</div><div class="cmd">'+esc(s.cmd)+'</div>':'')+
  '<div class="actions">'+(last?'<button class="btn" id="again">Choose another persona</button><a class="btn ghost" href="/demo-platform" style="text-decoration:none">Full platform view</a>':'<button class="btn" id="nx">Next: '+esc(p.steps[st.i+1].t)+' \u2192</button>')+'</div></div></div>'+
  '<div class="ledger"><h2>Ledger</h2><div class="blocks">'+st.led.map(function(b,i){return (i?'<span class="arrow">\u2192</span>':'')+'<div class="blk"><b>#'+b.n+'</b> '+esc(b.t)+'<div class="h">'+b.h+'</div></div>';}).join("")+'</div><div class="muted" style="font-size:12.5px">Append-only and hash-chained: each entry includes the previous entry\u2019s hash, so any change breaks the chain. Personal data never goes on the ledger, only digests. (Demo hashes are illustrative.)</div></div>';
 st.flash=false;var nx=document.getElementById("nx");if(nx)nx.onclick=next;var ag=document.getElementById("again");if(ag)ag.onclick=function(){home();};
 var bl=app.querySelector(".blocks");if(bl)bl.scrollLeft=bl.scrollWidth;}
sw.onclick=function(e){e.preventDefault();home();};
function route(){var id=location.hash.slice(1);if(id&&P.some(function(p){return p.id===id;})){if(!st||st.p.id!==id)start(id);}else home();}
window.addEventListener("hashchange",route);route();
</script>
